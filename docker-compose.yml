services:
  minio:
    image: ${MINIO_IMAGE:-cgr.dev/chainguard/minio:latest}
    container_name: immo-minio
    command: server /data --console-address ":9001"
    # L'image Chainguard tourne en UID 65532 par défaut : root évite l'erreur
    # "file access denied" sur le dossier monté (usage local uniquement).
    user: "0:0"
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # console web
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Définir MINIO_ROOT_USER dans .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Définir MINIO_ROOT_PASSWORD dans .env}
    volumes:
      - ./minio_data:/data
    restart: unless-stopped